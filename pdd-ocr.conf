# pdd-ocr.conf —— 两处 OCR 调用共用的配置
#
# 谁在读这一份：
#   1) `pdd.sh` 的六档 tesseract（线上那条链：整页 psm 11 / 整页 psm 6 / band 裁片 / 胶囊反色 /
#      pend 复读 / 进度行读数）。
#   2) `tools/vlm-attribute.sh` 的视觉接口（离线归因，把失败帧发给外部模型问「这屏写着什么」）。
#   两边读同一份，改一处两边跟着一起变。两份脚本里各自还留着一套内建默认，只在这份文件不在时生效。
#
# 装到哪儿：主机 `~/Desktop/pdd-ocr.conf`（权限 600）。`scripts/deploy.sh` 只在主机上还没有这份文件时
#   才装仓库这份；已经有了就一个字不动、只把它和带来的这份的差异念出来（这里是平时改参数的地方）。
#   换位置：`pdd.sh` 那侧给环境变量 `OCR_CONF_FILE=<路径>`；工具那侧给 `--conf <路径>`（或同名环境变量）。
#   别猜生效的是哪份：`pdd.sh status` 那行「OCR 配置」会打出文件路径、从文件取了几个键、被环境变量占了几个。
#
# 格式：一行一个 `KEY=VALUE`。`=` 两边不要留空格；值原样取到行尾，**不要加引号**；行首 `#` 是注释；
#   值里可以写 `~` 或 `$HOME`，装载时展开成当前用户的家目录；行尾空格会被抹掉。
#   值里不能出现换行 —— 要一整段提示词就写 `VLM_PROMPT_FILE=<那个文件的路径>`，工具会把整份文件当提示词。
#
# 优先级：脚本内建默认 < 本文件 < 环境变量 <（工具的）命令行参数。
#   环境变量这一层是给桩沙箱和一次性试验留的口子，平常用不到。
#
# 名单之外的键 = 当场停（退出码 78，报行号）。`DEVICE=`、`REGION_bag=` 这类写进来不报错但没人读，
#   比不写更坏（她以为改了，其实跑的是老配置），所以宁可停。两边的名单都是**逐个列出来的**，
#   不是按前缀放的 —— 按前缀会把 `PILL_light`（标定框）、`OCR_CONF_STATE`（记账变量）、
#   `VLM_API_KEY`（凭据）这类东西当成"认得的键"收进去。名单：
#   pdd.sh 用：`OCR_LANG` `OCR_PSM` `OCR_PSM_PAGE` `OCR_MINCONF` `OCR_PSM_BAND` `OCR_PSM_BAND_<key>`
#             `PEND_PSM` `BAND_SCALE` `BAND_CUTOFF` `PILL_TH` `PILL_SCALES` `PILL_MODE_<key>`
#   工 具 用：`VLM_API_URL_FILE` `VLM_MODEL` `VLM_TIMEOUT` `VLM_PROMPT` `VLM_PROMPT_FILE`
#             `VLM_MAX` `VLM_LOCAL_MAX_PNG` `PDD_SH`
#   两边各把对方那批当"认得但不应用"；`VLM_API_URL` `VLM_API_KEY` `VLM_STUB` 两边都直接停。
#   下面这批值就是当前线上那套（11-01 从 `pdd.sh` 配置区抄下来，一个字没改；只有 BAND_SCALE/BAND_CUTOFF
#   这两个原先写死在内嵌 python 里，这次把同一个数搬到配置区，值没动），
#   每个键后面那句"为什么是这个数"只在 pdd.sh 的配置区里有完整实测记录，这里只留一句。

# ---------------------------------------------------------------- 一、tesseract：调哪几档
# 语言包。缺 chi_sim 时整条 OCR 通道直接不跑（`have tesseract` + 这个词表）。
OCR_LANG=chi_sim+eng
# 整页稀疏档（六档里 OCR 的第一枪）。
OCR_PSM=11
# 整页文字档（第二枪）。「立即点亮」和进度行「N天内再点亮N次」只有这一档认得出。
OCR_PSM_PAGE=6
# 命中行的最低置信度；低于这个数的行直接丢，不给候选。
OCR_MINCONF=40
# band 裁片档的 psm 阶梯（全局默认，单行）。
OCR_PSM_BAND=7
# 只给 browse 这一个键补 psm 6：10-18 真机那条消费券页横幅只有 psm 6 读得到。
# 顺序是"先 7 后 6"，因为 pick() 取文件顺序第一个 in-region 命中，不是最高分。
OCR_PSM_BAND_browse=7 6
# 只给 done 这一个键也补 psm 6：10-25/26 那两屏顶部「已使用」那行，psm 7 全空、psm 6 12/12。
OCR_PSM_BAND_done=7 6
# pend 那一档抄整句用的复读阶梯（图只截一次，换的是识别模式）。
PEND_PSM=6 11 12

# ---------------------------------------------------------------- 二、tesseract：裁片怎么预处理
# band 档：裁 REGION_<key> 那条，转灰度、autocontrast、放大几倍再 OCR。
# 这个倍数同时是坐标回算的除数（tsv 里是放大后的坐标），改了不改除数命中点会全飞出场外。
BAND_SCALE=3
# autocontrast 的直方图裁边百分比。换控件要重扫（10-08 量的是 1）。
BAND_CUTOFF=1
# 胶囊档：深底白字那颗，反色 + 硬阈值。阈值 120 是在「立即点亮」那颗上扫出来的（100 和 160 都会花）。
PILL_TH=120
# 胶囊档并跑几个放大倍数：×1 收「今日已点亮」，×2 收「立即点亮」，同一档盖不住两个状态。
PILL_SCALES=1 2
# 按 key 换胶囊档的预处理：默认反色+硬阈值；这颗靠颜色分开，转灰度就糊，所以走原色。
PILL_MODE_bag=color

# ---------------------------------------------------------------- 三、离线归因：视觉接口
# 端点文件的路径，不是端点本身。第 1 行 URL、第 2 行可选 Bearer key。
# 这个文件里**永远只写路径**：值是凭据，本仓库公开，装它的文件权限 600、不进 git、不进任何提交。
VLM_API_URL_FILE=~/Desktop/pdd-vlm.url
# 模型名。留空 = 请求体里连 model 键都不发（有些兼容端点按 key 自己定模型，发过去反而 400）。
VLM_MODEL=
# 单帧请求的超时秒数（curl -m）。
VLM_TIMEOUT=90
# 提示词（一行）。和 tools/vlm-attribute.sh 里内建那四句逐字相同，只是把三处换行去掉了 ——
# 这份文件生效时发出去的就是这一行。要保留换行排版就把它注释掉，改指下面的 VLM_PROMPT_FILE。
VLM_PROMPT=这是一张手机屏幕截图（拼多多的活动页或首页）。把你能看清的中文文本逐行列出来，每行给两个字段："text"：照抄屏幕上那几个字，不要补全、不要纠正错别字、不要换成别的说法；"box"：这一行在图中的位置，写成 [x0,y0,x1,y1]，归一化到 0..1（原点在左上角，x 向右、y 向下，分别除以图片的宽高）。只输出一个 JSON 数组，不要解释、不要 markdown 代码块。看不清的行整行省略 —— 宁可少给几行，也不要为了凑格式猜字。
# 提示词文件（可选）。非空就整份读进来顶掉上面那行；文件不存在或读不了 = 退出码 78，不猜。
VLM_PROMPT_FILE=
# 默认最多拿几帧（工具的 --max 更高优先；0 = 不限，把选中的帧全建一遍请求体）。
VLM_MAX=0
# 现役 pdd.sh 的位置：工具从里面读 ALIAS_<key> 做词表对照，并拿它跑本地那一栏的 replay。
# 这个键是给工具用的，pdd.sh 自己不看它。
PDD_SH=~/Desktop/pdd.sh
# 「本地六档」那一栏要不要跑的量闸门：一个运行目录的 png 张数超过它就不跑 replay
# （replay 扫的是整个目录，工具的 --max 限不住它）。11-01 主机空闲实测摊下来 4~5 秒一帧
# （32 帧 2 分 11 秒、17 帧 1 分 25 秒），12 帧 ≈ 一分钟。
VLM_LOCAL_MAX_PNG=12

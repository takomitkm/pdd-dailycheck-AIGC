[project]
name = "pddcheck"
version = "0.1.0"
description = "PDD 每日签到自动化（refactor-v2 模块化实现，见 docs/refactor-v2/）"
readme = "docs/refactor-v2/README.md"
requires-python = ">=3.11"
# 运行依赖在后端裁决（T03/T03-M/T16，ADR-001/002）后由集成人统一锁定；
# 在此之前任何模块不得自行添加第三方运行依赖。
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pddcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
